<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#061c2e" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#00c6ff" />
    </linearGradient>

    <linearGradient id="energy-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38ef7d" />
      <stop offset="100%" stop-color="#11998e" />
    </linearGradient>

    <linearGradient id="amber-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f6d365" />
      <stop offset="100%" stop-color="#fda085" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
      <circle cx="40" cy="0" r="1.5" fill="rgba(0, 242, 254, 0.15)" />
    </pattern>

    <!-- Soft Blur Filter for Glows -->
    <filter id="glow-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .grid-bg { fill: url(#grid-pattern); }
    .pulse-line {
      stroke-dasharray: 8, 12;
      animation: dashMove 20s linear infinite;
    }
    .energy-pulse {
      stroke-dasharray: 60, 240;
      animation: pulseFlow 6s ease-in-out infinite;
    }
    .floating-orb {
      animation: orbFloat 8s ease-in-out infinite alternate;
    }
    .glow-node {
      animation: nodePulse 3s ease-in-out infinite alternate;
    }

    @keyframes dashMove {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: -400; }
    }
    @keyframes pulseFlow {
      0% { stroke-dashoffset: 300; opacity: 0.2; }
      50% { stroke-dashoffset: 0; opacity: 0.8; }
      100% { stroke-dashoffset: -300; opacity: 0.2; }
    }
    @keyframes orbFloat {
      0% { transform: translateY(0px) scale(1); }
      100% { transform: translateY(-16px) scale(1.08); }
    }
    @keyframes nodePulse {
      0% { r: 4px; opacity: 0.5; }
      100% { r: 7px; opacity: 1; }
    }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" />
  <rect width="1200" height="360" rx="16" class="grid-bg" />

  <!-- DYNAMIC & ANIMATED BACKGROUND ELEMENTS (Behind Text & Borders) -->
  <g opacity="0.6">
    <!-- Ambient Glow Orbs -->
    <circle cx="180" cy="60" r="120" fill="#00f2fe" opacity="0.08" filter="url(#glow-blur)" class="floating-orb" />
    <circle cx="1020" cy="300" r="140" fill="#38ef7d" opacity="0.08" filter="url(#glow-blur)" class="floating-orb" style="animation-delay: -3s;" />

    <!-- Smart Grid Circuit Flow 1 -->
    <path d="M 50 300 Q 250 340 450 290 T 850 310 T 1150 270" fill="none" stroke="rgba(0, 242, 254, 0.18)" stroke-width="2" class="pulse-line" />
    <path d="M 50 300 Q 250 340 450 290 T 850 310 T 1150 270" fill="none" stroke="url(#primary-grad)" stroke-width="3" class="energy-pulse" filter="url(#glow-blur)" />

    <!-- Smart Grid Circuit Flow 2 -->
    <path d="M 80 70 Q 320 30 600 80 T 1120 50" fill="none" stroke="rgba(56, 239, 125, 0.15)" stroke-width="1.5" class="pulse-line" style="animation-duration: 25s;" />
    <path d="M 80 70 Q 320 30 600 80 T 1120 50" fill="none" stroke="url(#energy-glow)" stroke-width="2.5" class="energy-pulse" style="animation-delay: -2s;" filter="url(#glow-blur)" />

    <!-- Network / Grid Nodes -->
    <circle cx="450" cy="290" r="5" fill="#00f2fe" class="glow-node" />
    <circle cx="850" cy="310" r="5" fill="#38ef7d" class="glow-node" style="animation-delay: -1.5s;" />
    <circle cx="600" cy="80" r="4" fill="#00f2fe" class="glow-node" style="animation-delay: -0.7s;" />
    <circle cx="320" cy="30" r="4" fill="#f6d365" class="glow-node" style="animation-delay: -2.1s;" />
  </g>

  <!-- Subtly Animated Utility Meter Bar Charts (Right Side Graphic Element) -->
  <g transform="translate(940, 110)" opacity="0.35">
    <rect x="0" y="70" width="14" height="60" rx="3" fill="url(#primary-grad)">
      <animate attributeName="height" values="60;90;45;60" dur="4s" repeatCount="indefinite" />
      <animate attributeName="y" values="70;40;85;70" dur="4s" repeatCount="indefinite" />
    </rect>
    <rect x="22" y="40" width="14" height="90" rx="3" fill="url(#energy-glow)">
      <animate attributeName="height" values="90;120;75;90" dur="5s" repeatCount="indefinite" />
      <animate attributeName="y" values="40;10;55;40" dur="5s" repeatCount="indefinite" />
    </rect>
    <rect x="44" y="85" width="14" height="45" rx="3" fill="url(#primary-grad)">
      <animate attributeName="height" values="45;80;30;45" dur="3.5s" repeatCount="indefinite" />
      <animate attributeName="y" values="85;50;100;85" dur="3.5s" repeatCount="indefinite" />
    </rect>
    <rect x="66" y="25" width="14" height="105" rx="3" fill="url(#amber-glow)">
      <animate attributeName="height" values="105;65;115;105" dur="4.5s" repeatCount="indefinite" />
      <animate attributeName="y" values="25;65;15;25" dur="4.5s" repeatCount="indefinite" />
    </rect>
    <rect x="88" y="55" width="14" height="75" rx="3" fill="url(#energy-glow)">
      <animate attributeName="height" values="75;110;50;75" dur="5.5s" repeatCount="indefinite" />
      <animate attributeName="y" values="55;20;80;55" dur="5.5s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- FOREGROUND BRANDING & LABELS (High Contrast, Guaranteed Clarity) -->

  <!-- Status / Ecosystem Tag Pill -->
  <g transform="translate(100, 52)">
    <rect width="250" height="32" rx="16" fill="rgba(0, 242, 254, 0.08)" stroke="rgba(0, 242, 254, 0.3)" stroke-width="1.5" />
    <circle cx="16" cy="16" r="5" fill="#38ef7d" />
    <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#00f2fe" letter-spacing="1.5">SMART ENERGY &amp; UTILITIES</text>
  </g>

  <!-- Main Title -->
  <text x="100" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
    Awesome Energy &amp; Utilities <tspan fill="url(#primary-grad)">CRM</tspan>
  </text>

  <!-- Subtitle -->
  <text x="100" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#cbd5e1">
    Curated SaaS Platforms, Open-Source Meter-to-Cash, &amp; Smart Grid CIS Solutions
  </text>

  <!-- Pillar Pills -->
  <g transform="translate(100, 226)">
    <!-- Pill 1: CIS & Billing -->
    <g transform="translate(0, 0)">
      <rect width="180" height="36" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
      <text x="90" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">⚡ CIS &amp; Utility Billing</text>
    </g>

    <!-- Pill 2: Smart Metering & AMI -->
    <g transform="translate(192, 0)">
      <rect width="200" height="36" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
      <text x="100" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">📊 Smart Metering &amp; AMI</text>
    </g>

    <!-- Pill 3: Distributed Energy / PAYGO -->
    <g transform="translate(404, 0)">
      <rect width="190" height="36" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
      <text x="95" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">🌱 DERs &amp; Mini-Grids</text>
    </g>

    <!-- Pill 4: Open Source -->
    <g transform="translate(606, 0)">
      <rect width="165" height="36" rx="8" fill="rgba(56, 239, 125, 0.08)" stroke="rgba(56, 239, 125, 0.3)" stroke-width="1" />
      <text x="82.5" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="600" fill="#38ef7d" text-anchor="middle">🔓 100% Open Source</text>
    </g>
  </g>

  <!-- Card Border Glow -->
  <rect x="0" y="0" width="1200" height="360" rx="16" fill="none" stroke="rgba(0, 242, 254, 0.2)" stroke-width="1.5" />
</svg>
